<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SpearCounter</title>
<link rel="manifest" href="manifest.webmanifest?v=1.1.1">
<meta name="theme-color" content="#6b2119">
<link rel="icon" type="image/png" sizes="192x192" href="icons/sc-icon-192.png">
<link rel="apple-touch-icon" href="icons/sc-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpearCounter">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bitter:wght@400;600;700&display=swap">
<style>
/* Layout : barre rouge en haut (titre + onglets), contenu clair façon fiche officielle, couleur des capacités = phase de jeu */
:root{
  color-scheme: light;
  --bar:#6b2119; --bar-ink:#ffffff;
  --khaki:#b9a979; --olive:#9c8a35; --olive-dk:#6f6123;
  --page:#f1f1f1; --card:#ffffff; --colhead:#d6d6d6; --namebar:#333333;
  --ink:#1b1b1b; --muted:#5f5f5f; --line:#c9c9c9;
  --save:#3e6b26; --disc:#141414; --rim:#b49a48;
  /* Couleurs de phase */
  --ph-hero:#9a8a3c; --ph-shoot:#24475f; --ph-fight:#6e2620; --ph-charge:#a8683a;
  --ph-passive:#000000; --ph-end:#4f3866; --ph-defense:#38521b; --ph-move:#5b5b5b;
  --display:"Oswald", "Arial Narrow", Impact, sans-serif;
  --body:"Bitter", Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.in{max-width:820px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button,select,input{font-family:inherit}
:focus-visible{outline:3px solid var(--rim);outline-offset:2px}

/* Barre du haut */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.bar .top{display:flex;align-items:center;gap:10px;min-height:64px;padding-block:8px}
.back{flex:none;display:grid;place-items:center;width:40px;height:40px;margin-left:-8px;background:none;border:0;color:var(--bar-ink);cursor:pointer;border-radius:4px}
.back:hover{background:rgba(255,255,255,.12)}
.back[hidden]{display:none}
.ttl{min-width:0;display:grid;gap:2px}
.kicker{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#e9c96b}
.bar h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(20px,5.5vw,30px);line-height:1.05;margin:0;letter-spacing:.01em;min-width:0;overflow:hidden;white-space:normal;text-wrap:balance}
.tabs{display:flex;gap:4px}
.tabs a{flex:1;text-align:center;font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:rgba(255,255,255,.7);text-decoration:none;padding:10px 8px 9px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:#e9c96b;border-bottom-color:#e9c96b}
.tabs[hidden]{display:none}

main{padding-block:16px 40px}

/* Mémo : une barre par unité */
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.unit-link{aspect-ratio:1;max-width:100%;min-width:0;display:grid;place-items:center;text-align:center;background:var(--namebar);color:#fff;border:0;border-radius:8px;padding:clamp(6px,1.6vw,14px);font:700 clamp(15px,4.4vw,20px)/1.25 var(--body);cursor:pointer;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none}
.unit-link:hover{background:#000}

/* Fiche */
.sheet{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)))}
.statband{background:radial-gradient(ellipse at 50% 120%, #c9b85a 0%, var(--olive) 45%, var(--olive-dk) 100%);padding:18px 12px 14px}
.stats{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,78px));justify-content:center;gap:clamp(8px,2.5vw,14px);text-align:center}
.disc{width:min(64px,17vw);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 40% 35%, #3a3a3a, var(--disc) 70%);border:3px solid var(--rim);display:grid;place-items:center;color:#fff;font:700 19px var(--body);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.disc.wd{background:radial-gradient(circle at 40% 35%, #b5463a, #7a1f17 70%)}
.disc.sv{background:radial-gradient(circle at 40% 35%, #5f9440, var(--save) 70%)}
.stats .l{font:500 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:#fff;margin-top:6px}
.sec{background:var(--khaki);color:#fff;font:700 17px var(--body);text-transform:uppercase;letter-spacing:.04em;padding:14px 16px;margin:0}
.colhead,.vals{display:grid;text-align:center;font-variant-numeric:tabular-nums}
.colhead{background:var(--colhead);font:700 14px var(--body);text-transform:uppercase;padding:10px 12px}
.ranged .colhead,.ranged .vals{grid-template-columns:1.2fr repeat(5,1fr)}
.melee .colhead,.melee .vals{grid-template-columns:repeat(5,1fr)}
.weapon{padding:14px 16px 6px;background:var(--page)}
.wname{background:var(--namebar);color:#fff;border-radius:6px;padding:10px 14px;font:700 17px var(--body)}
.vals{font:700 19px var(--body);padding:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:6px}
.chip{border:2px dashed #555;border-radius:6px;padding:3px 10px;font:700 14px var(--body);background:var(--card)}
.abilities{padding:16px;display:grid;gap:12px;background:var(--page)}
.ab{border-radius:12px;overflow:hidden;border:3px solid var(--c);background:var(--card)}
.ab-head{background:var(--c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;font:700 16px/1.3 var(--body)}
.hex{flex:none;width:34px;height:34px;background:#fff;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);display:grid;place-items:center}
.hex span{width:30px;height:30px;background:#000;clip-path:inherit;display:grid;place-items:center;font-size:15px}
.cast{flex:none;width:36px;height:36px;border-radius:50%;background:#000;border:2px solid #fff;display:grid;place-items:center;font-size:16px}
.chant{flex:none;width:30px;height:30px;margin:3px;transform:rotate(45deg);background:#000;border:2px solid #fff;display:grid;place-items:center}
.chant span{transform:rotate(-45deg);font-size:15px}
.cost{flex:none;font:700 16px var(--body);white-space:nowrap}
.unit-link.has-photo{place-items:end start;text-align:left;background:linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,.55) 35%, rgba(0,0,0,0) 70%), var(--img) center 30%/cover no-repeat, #e8e5df;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hero-photo{background:radial-gradient(ellipse at center, #fbfaf7 0%, #e3dfd8 100%);display:flex;justify-content:center}
.hero-photo img{display:block;width:100%;max-width:640px;max-height:300px;object-fit:contain}
.army-link{background:var(--bar)}
.ab-name{padding:12px 16px;font:700 15px var(--body);border-bottom:2px solid #dcdcdc}
.ab-body{padding:12px 16px 14px;max-width:70ch}
.ab-body p{margin:0}
.ab-body p + p{margin-top:8px}
.kw{margin:16px;padding:14px 16px;border:2px solid #9a9a9a;border-radius:10px;background:var(--card);font-size:14px}
.kw b{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 16px;background:var(--page)}
.legend span{font:600 12px var(--body);color:#fff;background:var(--c);border-radius:4px;padding:3px 8px}

@media (max-width:420px){.ranged .colhead,.ranged .vals{font-size:15px}.vals{font-size:17px}}
/* Phases */
.phases{display:grid;gap:10px}
.phase{border-radius:10px;overflow:hidden;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.phase > summary{list-style:none;cursor:pointer;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font:700 16px var(--body)}
.phase > summary::-webkit-details-marker{display:none}
.phase > summary .count{flex:none;min-width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,.35);display:grid;place-items:center;font-size:14px;padding:0 8px}
.phase > summary .count.zero{opacity:.5}
.phase[open] > summary{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.phase .abilities{padding:12px}
.phase .none{margin:0;padding:14px 16px;color:var(--muted)}
.rules-photo{margin:-16px calc(-1 * max(16px, env(safe-area-inset-left,0px))) 0}
.rules .sec{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)))}
.rules .abilities{padding-inline:0}
.hint{margin:0;padding:10px 0 0;color:var(--muted);font-size:14px}
.pick{display:block;position:relative;cursor:pointer;border-radius:14px}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick .ab{opacity:.55;transition:opacity .15s}
.pick input:checked + .ab{opacity:1;box-shadow:0 0 0 3px var(--rim)}
.pick input:focus-visible + .ab{outline:3px solid var(--rim);outline-offset:3px}
.pick .tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:15px;line-height:1}
.pick input:checked + .ab .tick{background:#fff;color:var(--c)}
.pick input:checked + .ab .tick::before{content:"\2713";font-weight:700}
/* Bouton installer (discret) */
.install{flex:none;margin-left:auto;display:flex;align-items:center;gap:5px;background:none;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.8);border-radius:999px;padding:5px 10px;font:500 11px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.install:hover{background:rgba(255,255,255,.12);color:#fff}
.install[hidden]{display:none}
.ios-hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;width:min(92vw,360px);background:#1b1b1b;color:#fff;border-radius:12px;padding:14px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.ios-hint[hidden]{display:none}
.ios-hint p{margin:0 0 10px}
.ios-hint button{background:#e9c96b;color:#1b1b1b;border:0;border-radius:6px;padding:6px 12px;font:700 13px var(--body);cursor:pointer}
.sh-soon{margin:18px 4px 0;text-align:center;color:var(--muted);font-style:italic;font-size:14px}
/* Accueil */
.home-intro{margin:0 0 12px;font:500 14px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sh-link small{display:block;margin-top:4px;font:500 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#e9c96b}
.home-sep{margin-top:28px}
/* Pages de règles (pack de bataille) */
.doc{padding:16px;display:grid;gap:12px;background:var(--page)}
.doc > h3{margin:10px 0 0;font:700 15px var(--body);text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--khaki);padding:10px 14px;border-radius:6px}
.doc > h3:first-child{margin-top:0}
.doc > p,.doc > ul,.doc > ol{margin:0;background:var(--card);border-radius:8px;padding:12px 16px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.doc > ul,.doc > ol{padding-left:34px;display:grid;gap:6px}
.doc .note{border-left:4px solid #9a7a1c}
.doc-photo{margin:-16px -16px 0}
.doc-photo img{max-height:520px}
.doc .ab-img{background:#f3f1ed;display:flex;justify-content:center;padding:10px 16px;border-bottom:2px solid #dcdcdc}
.doc .ab-img img{display:block;max-width:100%;max-height:170px;object-fit:contain}
.card{border-radius:12px;overflow:hidden;border:3px solid var(--c);background:var(--card)}
.card-head{background:var(--c);color:#fff;padding:10px 16px;font:500 12px var(--display);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px}
.card-name{padding:12px 16px 4px;font:700 17px var(--body)}
.card-name small{display:block;font:600 13px var(--body);color:var(--muted);margin-top:2px}
.card-body{padding:6px 16px 14px;display:grid;gap:10px}
.card-body p{margin:0}
.under{border-left:4px solid var(--bar);padding:8px 12px;background:#f7f2f1;border-radius:6px}
.under b{color:var(--bar)}
.part{border-radius:8px;overflow:hidden;border:2px solid var(--pc)}
.part-head{background:var(--pc);color:#fff;padding:7px 12px;font:700 13px var(--body);display:flex;justify-content:space-between;gap:8px}
.part-head span:last-child{font-weight:600;opacity:.9;text-align:right}
.part-body{padding:10px 12px}
.part-body .nm{font-weight:700;margin-bottom:4px}
.part-body .nm small{color:var(--muted);font-weight:600}
/* Barre de navigation du bas */
:root{--navh:calc(64px + env(safe-area-inset-bottom,0px))}
body{padding-bottom:var(--navh)}
body.g-has-foot{padding-bottom:calc(var(--navh) + 66px)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#fff;border-top:1px solid #d8d8d8;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.bnav .in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:820px;margin:0 auto}
.bnav a{display:grid;justify-items:center;gap:3px;padding:8px 2px 9px;text-decoration:none;color:#6d6d6d;font:500 12px var(--display);text-transform:uppercase;letter-spacing:.06em;border-top:3px solid transparent;margin-top:-1px}
.bnav a[aria-current="page"]{color:var(--bar);border-top-color:var(--bar)}
.bnav svg{width:24px;height:24px}
/* Partie */
#view-partie{--gold:#d4ae3f;--gold-dk:#9a7a1c;--soft:#ececec;--ok:#3e6b26}
.g-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding-block:2px 12px}
.g-score[hidden]{display:none}
.g-score .nm{font:600 15px var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-score .nm:first-child{text-align:right}
.g-score .pts{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.g-stack{display:grid;gap:14px}
.g-panel{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.g-sec{background:var(--khaki);color:#fff;font:700 15px var(--body);text-transform:uppercase;letter-spacing:.04em;padding:11px 16px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.g-sec.dark{background:var(--namebar)}
.g-body{padding:14px 16px;display:grid;gap:14px}
.g-lbl{display:block;font:600 12px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.g-hint{font-size:13px;color:var(--muted);margin:0}
.g-row{display:flex;gap:8px;align-items:center}
.g-grow{flex:1;min-width:0}
.g-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#view-partie input[type=text],#view-partie select{width:100%;font:600 16px var(--body);color:var(--ink);background:#f7f7f7;border:2px solid var(--line);border-radius:6px;padding:9px 10px}
.g-btn{display:block;text-align:center;text-decoration:none;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:10px 14px;font:700 15px var(--body);min-height:46px;cursor:pointer}
.g-btn.primary{background:var(--bar);border-color:var(--bar);color:#fff}
.g-btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1b1b}
.g-btn.ghost{background:none;border-color:transparent;color:var(--bar);padding-inline:6px;min-height:0}
.g-btn[disabled]{opacity:.45;cursor:not-allowed}
.g-pick{border:2px solid var(--line);background:#fff;border-radius:8px;padding:12px 10px;font:700 16px var(--body);min-height:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--ink)}
.g-pick[aria-pressed="true"]{background:var(--gold);border-color:var(--gold-dk);color:#1b1b1b}
.g-stepper{display:flex;align-items:center;gap:6px}
.g-stepper button{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:#fff;font:700 20px/1 var(--body);display:grid;place-items:center;padding:0;cursor:pointer;color:var(--ink)}
.g-stepper output{min-width:34px;text-align:center;font:700 20px var(--display);font-variant-numeric:tabular-nums}
.g-switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g-who{display:flex;flex-wrap:wrap;gap:6px}
.g-tag{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:4px;background:var(--soft);color:var(--ink)}
.g-tag.out{background:var(--bar);color:#fff}
.g-tag.first{background:var(--gold);color:#1b1b1b}
.g-chips{display:flex;flex-wrap:wrap;gap:8px}
.g-chip{border:2px dashed #8a8a8a;background:#fff;border-radius:999px;padding:8px 14px;font:600 15px var(--body);display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);text-align:left}
.g-chip .v{font:700 13px var(--display);background:var(--soft);border-radius:999px;padding:1px 7px}
.g-chip[aria-pressed="true"]{background:var(--gold);border-style:solid;border-color:var(--gold-dk)}
.g-chip[aria-pressed="true"] .v{background:rgba(255,255,255,.55)}
.g-sub{display:flex;justify-content:space-between;font:600 14px var(--body);color:var(--muted);padding-top:2px}
.g-sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.g-note{border-left:4px solid var(--bar);background:#fff;padding:10px 12px;border-radius:6px;font-size:14px}
.g-note.gold{border-color:var(--gold-dk)}
.g-missing{margin:0;color:#a3231a;font-weight:600;font-size:14px}
.g-missing:empty{display:none}
.g-hero{padding:20px 16px;display:grid;gap:10px;text-align:center}
.g-hero h2{font:700 24px var(--display);text-transform:uppercase;margin:0}
