<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Forgeruines de Hashut</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6b2119">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hashut">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bitter:wght@400;600;700&display=swap">
<style>
/* Layout : barre rouge en haut (titre + onglets), contenu clair façon fiche officielle, couleur des capacités = phase de jeu */
:root{
  color-scheme: light;
  --bar:#6b2119; --bar-ink:#ffffff;
  --khaki:#b9a979; --olive:#9c8a35; --olive-dk:#6f6123;
  --page:#f1f1f1; --card:#ffffff; --colhead:#d6d6d6; --namebar:#333333;
  --ink:#1b1b1b; --muted:#5f5f5f; --line:#c9c9c9;
  --save:#3e6b26; --disc:#141414; --rim:#b49a48;
  /* Couleurs de phase */
  --ph-hero:#9a8a3c; --ph-shoot:#24475f; --ph-fight:#6e2620; --ph-charge:#a8683a;
  --ph-passive:#000000; --ph-end:#4f3866; --ph-defense:#38521b; --ph-move:#5b5b5b;
  --display:"Oswald", "Arial Narrow", Impact, sans-serif;
  --body:"Bitter", Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.in{max-width:820px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button,select,input{font-family:inherit}
:focus-visible{outline:3px solid var(--rim);outline-offset:2px}

/* Barre du haut */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.bar .top{display:flex;align-items:center;gap:10px;min-height:64px;padding-block:8px}
.back{flex:none;display:grid;place-items:center;width:40px;height:40px;margin-left:-8px;background:none;border:0;color:var(--bar-ink);cursor:pointer;border-radius:4px}
.back:hover{background:rgba(255,255,255,.12)}
.back[hidden]{display:none}
.ttl{min-width:0;display:grid;gap:2px}
.kicker{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#e9c96b}
.bar h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(20px,5.5vw,30px);line-height:1.05;margin:0;letter-spacing:.01em;min-width:0;overflow:hidden;white-space:normal;text-wrap:balance}
.tabs{display:flex;gap:4px}
.tabs a{flex:1;text-align:center;font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:rgba(255,255,255,.7);text-decoration:none;padding:10px 8px 9px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:#e9c96b;border-bottom-color:#e9c96b}
.tabs[hidden]{display:none}

main{padding-block:16px 40px}

/* Mémo : une barre par unité */
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.unit-link{aspect-ratio:1;max-width:100%;min-width:0;display:grid;place-items:center;text-align:center;background:var(--namebar);color:#fff;border:0;border-radius:8px;padding:clamp(6px,1.6vw,14px);font:700 clamp(15px,4.4vw,20px)/1.25 var(--body);cursor:pointer;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none}
.unit-link:hover{background:#000}

/* Fiche */
.sheet{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)))}
.statband{background:radial-gradient(ellipse at 50% 120%, #c9b85a 0%, var(--olive) 45%, var(--olive-dk) 100%);padding:18px 12px 14px}
.stats{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,78px));justify-content:center;gap:clamp(8px,2.5vw,14px);text-align:center}
.disc{width:min(64px,17vw);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 40% 35%, #3a3a3a, var(--disc) 70%);border:3px solid var(--rim);display:grid;place-items:center;color:#fff;font:700 19px var(--body);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.disc.wd{background:radial-gradient(circle at 40% 35%, #b5463a, #7a1f17 70%)}
.disc.sv{background:radial-gradient(circle at 40% 35%, #5f9440, var(--save) 70%)}
.stats .l{font:500 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:#fff;margin-top:6px}
.sec{background:var(--khaki);color:#fff;font:700 17px var(--body);text-transform:uppercase;letter-spacing:.04em;padding:14px 16px;margin:0}
.colhead,.vals{display:grid;text-align:center;font-variant-numeric:tabular-nums}
.colhead{background:var(--colhead);font:700 14px var(--body);text-transform:uppercase;padding:10px 12px}
.ranged .colhead,.ranged .vals{grid-template-columns:1.2fr repeat(5,1fr)}
.melee .colhead,.melee .vals{grid-template-columns:repeat(5,1fr)}
.weapon{padding:14px 16px 6px;background:var(--page)}
.wname{background:var(--namebar);color:#fff;border-radius:6px;padding:10px 14px;font:700 17px var(--body)}
.vals{font:700 19px var(--body);padding:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:6px}
.chip{border:2px dashed #555;border-radius:6px;padding:3px 10px;font:700 14px var(--body);background:var(--card)}
.abilities{padding:16px;display:grid;gap:12px;background:var(--page)}
.ab{border-radius:12px;overflow:hidden;border:3px solid var(--c);background:var(--card)}
.ab-head{background:var(--c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;font:700 16px/1.3 var(--body)}
.hex{flex:none;width:34px;height:34px;background:#fff;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);display:grid;place-items:center}
.hex span{width:30px;height:30px;background:#000;clip-path:inherit;display:grid;place-items:center;font-size:15px}
.cast{flex:none;width:36px;height:36px;border-radius:50%;background:#000;border:2px solid #fff;display:grid;place-items:center;font-size:16px}
.chant{flex:none;width:30px;height:30px;margin:3px;transform:rotate(45deg);background:#000;border:2px solid #fff;display:grid;place-items:center}
.chant span{transform:rotate(-45deg);font-size:15px}
.cost{flex:none;font:700 16px var(--body);white-space:nowrap}
.unit-link.has-photo{place-items:end start;text-align:left;background:linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,.55) 35%, rgba(0,0,0,0) 70%), var(--img) center 30%/cover no-repeat, #e8e5df;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hero-photo{background:radial-gradient(ellipse at center, #fbfaf7 0%, #e3dfd8 100%);display:flex;justify-content:center}
.hero-photo img{display:block;width:100%;max-width:640px;max-height:300px;object-fit:contain}
.army-link{background:var(--bar)}
.ab-name{padding:12px 16px;font:700 15px var(--body);border-bottom:2px solid #dcdcdc}
.ab-body{padding:12px 16px 14px;max-width:70ch}
.ab-body p{margin:0}
.ab-body p + p{margin-top:8px}
.kw{margin:16px;padding:14px 16px;border:2px solid #9a9a9a;border-radius:10px;background:var(--card);font-size:14px}
.kw b{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 16px;background:var(--page)}
.legend span{font:600 12px var(--body);color:#fff;background:var(--c);border-radius:4px;padding:3px 8px}

@media (max-width:420px){.ranged .colhead,.ranged .vals{font-size:15px}.vals{font-size:17px}}
/* Phases */
.phases{display:grid;gap:10px}
.phase{border-radius:10px;overflow:hidden;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.phase > summary{list-style:none;cursor:pointer;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font:700 16px var(--body)}
.phase > summary::-webkit-details-marker{display:none}
.phase > summary .count{flex:none;min-width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,.35);display:grid;place-items:center;font-size:14px;padding:0 8px}
.phase > summary .count.zero{opacity:.5}
.phase[open] > summary{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.phase .abilities{padding:12px}
.phase .none{margin:0;padding:14px 16px;color:var(--muted)}
.rules-photo{margin:-16px calc(-1 * max(16px, env(safe-area-inset-left,0px))) 0}
.rules .sec{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)))}
.rules .abilities{padding-inline:0}
.hint{margin:0;padding:10px 0 0;color:var(--muted);font-size:14px}
.pick{display:block;position:relative;cursor:pointer;border-radius:14px}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick .ab{opacity:.55;transition:opacity .15s}
.pick input:checked + .ab{opacity:1;box-shadow:0 0 0 3px var(--rim)}
.pick input:focus-visible + .ab{outline:3px solid var(--rim);outline-offset:3px}
.pick .tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:15px;line-height:1}
.pick input:checked + .ab .tick{background:#fff;color:var(--c)}
.pick input:checked + .ab .tick::before{content:"\2713";font-weight:700}
/* Bouton installer (discret) */
.install{flex:none;margin-left:auto;display:flex;align-items:center;gap:5px;background:none;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.8);border-radius:999px;padding:5px 10px;font:500 11px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.install:hover{background:rgba(255,255,255,.12);color:#fff}
.install[hidden]{display:none}
.ios-hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;width:min(92vw,360px);background:#1b1b1b;color:#fff;border-radius:12px;padding:14px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.ios-hint[hidden]{display:none}
.ios-hint p{margin:0 0 10px}
.ios-hint button{background:#e9c96b;color:#1b1b1b;border:0;border-radius:6px;padding:6px 12px;font:700 13px var(--body);cursor:pointer}
.who{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px 2px}
.ab-wrap + .ab-wrap{margin-top:12px}
</style>
</head>
<body>

<header class="bar">
  <div class="in top">
    <button class="back" id="back" type="button" aria-label="Retour" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="ttl"><span class="kicker">Spearhead</span><h1 id="title">Forgeruines de Hashut</h1></div>
    <button class="install" id="install" type="button" hidden aria-label="Installer l'application"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Installer</button>
  </div>
  <nav class="in tabs" id="tabs">
    <a href="#memo" id="nav-memo">Mémo</a>
    <a href="#regles" id="nav-regles">Règles</a>
    <a href="#phases" id="nav-phases">Phases</a>
  </nav>
</header>

<main class="in">
  <!-- Mémo -->
  <section id="view-memo"><div class="list" id="list"></div></section>

  <!-- Fiche unité -->
  <section id="view-unit" hidden><div class="sheet" id="unit"></div></section>

  <!-- Règles -->
  <section id="view-regles" hidden><div class="rules" id="regles"></div></section>

  <!-- Phases -->
  <section id="view-phases" hidden><div class="phases" id="phases"></div></section>

</main>

<div class="ios-hint" id="ios-hint" role="dialog" aria-label="Installer l'application" hidden>
  <p>Pour installer l'app : touche le bouton <b>Partager</b> de Safari, puis <b>Sur l'écran d'accueil</b>.</p>
  <button type="button" id="ios-hint-ok">OK</button>
</div>

<script>
(function(){
  "use strict";
  // Couleur par phase (code couleur de l'application officielle)
  const PHASE = {
    hero:"var(--ph-hero)", shoot:"var(--ph-shoot)", fight:"var(--ph-fight)", charge:"var(--ph-charge)",
    passive:"var(--ph-passive)", end:"var(--ph-end)", defense:"var(--ph-defense)", move:"var(--ph-move)"
  };
  const PHASE_LABEL = {hero:"Phase des héros", move:"Mouvement", shoot:"Tir", charge:"Charge", fight:"Combat", end:"Fin de tour", defense:"Défense", passive:"Passif général"};

  // ---------- Données ----------
  const UNITS = [
    {id:"despote", en:"Despote de Guerre",
      stats:{M:'4"', S:6, C:2, Sv:"3+"},
      weapons:[{n:"Vouge de Flambedémon", range:"Mêlée", a:5, h:3, w:3, r:1, d:"2", crit:"mortal"}],
      abilities:[
        {c:"end", t:"Passif", n:"Impitoyable Conquérant", x:[
          "Effet : si cette unité a au moins un point de pouvoir démoniaque, les unités amies ayant 0 point de pouvoir démoniaque comptent comme ayant 1 point de pouvoir démoniaque tant qu'elles sont entièrement à 6\" et visibles d'elle.",
          "Pour chaque point de pouvoir démoniaque qu'a cette unité, ajoutez 3\" à la portée de cette aptitude."]}
      ],
      kw:"HÉROS, INFANTERIE"},
    {id:"dominotaure", en:"Machine Dominotaure avec Canons d'Immolation",
      stats:{M:'6"', S:10, C:2, Sv:"2+"},
      weapons:[
        {n:"Canons d'Immolation", range:'8"', a:5, h:2, w:4, r:1, d:"D3", crit:"none", extra:["Tir en combat"]},
        {n:"Cornes et Coups Cinglants", range:"Mêlée", a:3, h:4, w:3, r:1, d:"D3", crit:"none"}
      ],
      abilities:[
        {c:"passive", t:"Passif", n:"Force Démoniaque", x:[
          "Effet : pour chaque point de pouvoir démoniaque de cette unité :",
          "Ajoutez 1\" à sa caractéristique de Mouvement.",
          "Ajoutez 1 à la caractéristique d'Attaques de ses armes."]}
      ],
      kw:"MACHINE DE GUERRE, RENFORTS"},
    {id:"bombarde", en:"Bombarde de Tourment",
      stats:{M:'4"', S:8, C:2, Sv:"3+"},
      weapons:[
        {n:"Torrent d'Énergie de la Ruine", range:'30"', a:4, h:3, w:3, r:1, d:"D3", crit:"none", extra:["Anti-CAVALERIE (+1 Perf.)","Anti-INFANTERIE (+1 Perf.)"]},
        {n:"Armes d'Artilleurs", range:"Mêlée", a:3, h:4, w:4, r:0, d:"1", crit:"none"}
      ],
      abilities:[
        {c:"shoot", t:"Passif", n:"Trajectoire Calculée", x:[
          "Effet : ajoutez 1 aux jets de touche des attaques de tir de cette unité qui ciblent une unité ennemie ayant au moins 5 figurines et se trouvant à plus de 12\" de cette unité."]},
        {c:"shoot", t:"Une fois par tour (armée), votre phase de tir", n:"Bombardement de la Ruine", x:[
          "Annonce : si cette unité a utilisé une aptitude de TIR à ce tour et que toutes ses attaques ont ciblé la même unité ennemie, cette dernière est la cible. Ensuite, vous pouvez choisir comme cibles supplémentaires un nombre d'unités ennemies à 6\" de la cible égal au nombre de points de pouvoir démoniaque de cette unité.",
          "Effet : jetez un dé pour chaque cible. Sur 3+, soustrayez 3 au score de contrôle de la cible pour le restant du tour."]}
      ],
      kw:"MACHINE DE GUERRE"},
    {id:"cohorte", en:"Cohorte Infernale avec Lances Hashutites",
      stats:{M:'4"', S:1, C:1, Sv:"3+"},
      weapons:[{n:"Lance Hashutite", range:"Mêlée", a:2, h:3, w:4, r:0, d:"1", crit:"none", extra:["Anti-charge (+1 Perf.)"]}],
      abilities:[
        {c:"hero", t:"Une fois par bataille, n'importe quelle phase des héros", n:"Frappez les Gongs", x:[
          "Effet : le Porteur de Gong de cette unité (s'il y en a un) est un pion. Vous pouvez retirer ce Porteur de Gong du champ de bataille et ramener D3 figurines tuées dans son unité."]},
        {c:"defense", t:"Passif", n:"Résilience Démoniaque", x:[
          "Effet : appliquez l'effet correspondant au nombre de points de pouvoir démoniaque (PPD) de cette unité :",
          "1 PPD : cette unité a PROTECTION (6+).",
          "2 PPD : cette unité a PROTECTION (5+).",
          "3 PPD : cette unité a PROTECTION (5+) et vous ignorez le premier point de dégât qui lui est alloué à chaque phase."]}
      ],
      kw:"INFANTERIE, RENFORTS"}
  ];

  // Règles de l'armée
  const ARMY = {id:"armee", en:"Règles de l'armée", sections:[
    {key:"trait", title:"Trait de bataille", who:"Trait de bataille", abilities:[
      {c:"hero", t:"Une fois par tour (armée), votre phase des héros", n:"Dompter le Pouvoir Démoniaque", x:[
        "Effet : vous devez utiliser cette aptitude au début de chacune de vos phases des héros. Retirez tous les points de pouvoir démoniaque de chaque unité amie. Ensuite, gagnez autant de points de pouvoir démoniaque que le numéro du round de bataille en cours plus 1.",
        "Ensuite, allouez vos points de pouvoir démoniaque aux unités amies. Chaque unité peut avoir au maximum 3 points de pouvoir démoniaque. Ensuite, tous les points de pouvoir démoniaque non alloués sont perdus."]}
    ]},
    {key:"regiment", pick:true, title:"Aptitude de régiment", who:"Aptitude de régiment", abilities:[
      {c:"passive", t:"Une fois par bataille, phase de déploiement", n:"Progression Implacable", x:[
        "Annonce : choisissez comme cibles 2 unités de Cohortes Infernales amies.",
        "Effet : chaque cible peut immédiatement se déplacer de jusqu'à 3\" mais ne peut pas utiliser d'aptitude de CHARGE au premier round de bataille."]},
      {c:"shoot", t:"Une fois par tour, votre phase de tir", n:"Bombardement de Suppression", x:[
        "Annonce : choisissez comme cible une unité d'INFANTERIE ennemie à laquelle on a alloué au moins un point de dégât à ce tour à cause d'attaques de tir d'une Bombarde de Tourment amie.",
        "Effet : jusqu'au début de votre prochain tour, soustrayez 1 au nombre de dés jetés pour les jets de charge pour la cible, jusqu'à un minimum de 1."]}
    ]},
    {key:"opti", pick:true, title:"Optimisation du général", who:"Optimisation (général)", abilities:[
      {c:"hero", t:"Une fois par bataille, n'importe quelle phase des héros", n:"Parchemin de Pétrification", x:[
        "Effet : pour le restant du tour, votre général a une PROTECTION (2+) mais ne peut pas utiliser d'aptitude ni être la cible d'aptitude amie."]},
      {c:"shoot", t:"Une fois par bataille, votre phase de tir", n:"Calice de Ténèbres", x:[
        "Annonce : choisissez comme cible une unité ennemie visible à 12\" de votre général.",
        "Effet : infligez D3 dégâts mortels à la cible."]},
      {c:"defense", t:"Passif", n:"Talisman d'Obsidienne", x:[
        "Effet : ignorez le premier point de dégât alloué à votre général à chaque phase."]},
      {c:"fight", t:"Une fois par bataille, n'importe quelle phase de mêlée", n:"Amulette de Haine Brûlante", x:[
        "Effet : pour le restant du tour, les attaques de votre général infligent des touches critiques sur un jet de touche non modifié de 5+."]}
    ]}
  ]};
  const PHOTOS = {"armee": "img/armee.jpg", "bombarde": "img/bombarde.jpg", "cohorte": "img/cohorte.jpg", "despote": "img/despote.jpg", "dominotaure": "img/dominotaure.jpg"};
  const CRIT_LABEL = {none:"", "2hits":"Critique (2 touches)", auto:"Critique (blessure auto)", mortal:"Critique (mortel)"};

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const isMelee = w => w.range === "Mêlée";

  // ---------- Mémo ----------
  const chevron = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  $("list").innerHTML = UNITS.map(u => `<button type="button" class="unit-link${PHOTOS[u.id] ? " has-photo" : ""}" data-id="${u.id}"${PHOTOS[u.id] ? ` style="--img:url('${PHOTOS[u.id]}')"` : ""}><span>${esc(u.en)}</span></button>`).join("");
  $("list").addEventListener("click", e => { const t = e.target.closest(".unit-link"); if (t) location.hash = t.dataset.id; });

  function weaponBlock(u, list, ranged){
    if (!list.length) return "";
    const head = ranged ? ["Portée","A","Tou","Bles","Perf","Dég"] : ["A","Tou","Bles","Perf","Dég"];
    return `<div class="${ranged ? "ranged" : "melee"}"><h3 class="sec">${ranged ? "Armes de tir" : "Armes de mêlée"}</h3>
      <div class="colhead">${head.map(x => `<span>${x}</span>`).join("")}</div>` +
      list.map(({w,i}) => {
        const vals = [w.a, w.h + "+", w.w + "+", w.r || "-", w.d];
        if (ranged) vals.unshift(w.range);
        const chips = [w.crit !== "none" ? CRIT_LABEL[w.crit] : null, ...(w.extra || [])].filter(Boolean);
        return `<div class="weapon"><div class="wname">${esc(w.n)}</div>
          <div class="vals">${vals.map(v => `<span>${esc(v)}</span>`).join("")}</div>
          ${chips.length ? `<div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>` : ""}</div>`;
      }).join("") + `</div>`;
  }

  function abCard(a, tick){
    return `<div class="ab" style="--c:${PHASE[a.c]}"><div class="ab-head"><span>${esc(a.t)}</span>${tick ? `<span class="tick" aria-hidden="true"></span>` : ""}${a.hex ? `<span class="hex" aria-label="Valeur ${a.hex}"><span>${a.hex}</span></span>` : ""}${a.cast ? `<span class="cast" aria-label="Valeur de lancement ${a.cast}">${a.cast}</span>` : ""}${a.chant ? `<span class="chant" aria-label="Valeur de psalmodie ${a.chant}"><span>${a.chant}</span></span>` : ""}${a.cost ? `<span class="cost">${esc(a.cost)}</span>` : ""}</div>
        <div class="ab-name">${esc(a.n)}</div><div class="ab-body">${a.x.map(p => `<p>${esc(p)}</p>`).join("")}</div></div>`;
  }

  // ---------- Phases ----------
  const PHASES = [
    {k:"deploy",      n:"Phase de déploiement",     c:"passive"},
    {k:"start",       n:"Début du tour",            c:"passive"},
    {k:"start-opp",   n:"Début du tour adverse",    c:"passive"},
    {k:"hero",        n:"Phase des héros",          c:"hero"},
    {k:"hero-opp",    n:"Phase des héros adverse",  c:"hero"},
    {k:"move",        n:"Phase de mouvement",       c:"move"},
    {k:"move-opp",    n:"Phase de mouvement adverse", c:"move"},
    {k:"shoot",       n:"Phase de tir",             c:"shoot"},
    {k:"shoot-opp",   n:"Phase de tir adverse",     c:"shoot"},
    {k:"charge",      n:"Phase de charge",          c:"charge"},
    {k:"charge-opp",  n:"Phase de charge adverse",  c:"charge"},
    {k:"fight",       n:"Phase de combat",          c:"fight"},
    {k:"fight-opp",   n:"Phase de combat adverse",  c:"fight"},
    {k:"end",         n:"Fin du tour",              c:"end"},
    {k:"end-opp",     n:"Fin du tour adverse",      c:"end"}
  ];
  // Moment d'utilisation de chaque capacité
  const WHEN = {
    "Dompter le Pouvoir Démoniaque":["hero"],
    "Progression Implacable":["deploy"],
    "Bombardement de Suppression":["shoot"],
    "Parchemin de Pétrification":["hero","hero-opp"],
    "Calice de Ténèbres":["shoot"],
    "Talisman d'Obsidienne":["shoot-opp","fight-opp"],
    "Amulette de Haine Brûlante":["fight","fight-opp"],
    "Impitoyable Conquérant":["hero"],
    "Trajectoire Calculée":["shoot"],
    "Bombardement de la Ruine":["shoot"],
    "Frappez les Gongs":["hero","hero-opp"]
  };


  // ---------- Choix (aptitude de régiment + optimisation) ----------
  const STORE = "hashut-spearhead-choix";
  const CHOICE = {};
  try { Object.assign(CHOICE, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch(e){}
  ARMY.sections.forEach(sec => {
    if (sec.pick && !sec.abilities.some(a => a.n === CHOICE[sec.key])) CHOICE[sec.key] = sec.abilities[0].n;
  });
  function saveChoice(){ try { localStorage.setItem(STORE, JSON.stringify(CHOICE)); } catch(e){} }

  function renderRules(){
    let h = PHOTOS.armee ? `<div class="hero-photo rules-photo"><img src="${PHOTOS.armee}" alt="Règles de l'armée"></div>` : "";
    h += ARMY.sections.map(sec => {
      if (!sec.pick) return `<h3 class="sec">${esc(sec.title)}</h3><div class="abilities">${sec.abilities.map(a => abCard(a)).join("")}</div>`;
      return `<h3 class="sec">${esc(sec.title)} (1 au choix)</h3><p class="hint">Touche une carte pour la sélectionner.</p><div class="abilities" role="radiogroup" aria-label="${esc(sec.title)}">` +
        sec.abilities.map((a,i) => `<label class="pick"><input type="radio" name="${sec.key}" value="${i}"${CHOICE[sec.key] === a.n ? " checked" : ""}>${abCard(a, true)}</label>`).join("") + `</div>`;
    }).join("");
    $("regles").innerHTML = h;
  }
  $("regles").addEventListener("change", e => {
    const sec = ARMY.sections.find(x => x.key === e.target.name);
    if (!sec) return;
    CHOICE[sec.key] = sec.abilities[+e.target.value].n;
    saveChoice();
    renderPhases();
  });

  function renderPhases(){
    const SOURCES = [];
    ARMY.sections.forEach(sec => sec.abilities.forEach(a => {
      if (!sec.pick || CHOICE[sec.key] === a.n) SOURCES.push({who: sec.who, a});
    }));
    UNITS.forEach(u => {
      u.abilities.forEach(a => SOURCES.push({who: u.en, a}));
      (u.enhancements || []).forEach(a => SOURCES.push({who: u.en + " (amélioration)", a}));
    });
    $("phases").innerHTML = PHASES.map(ph => {
      const items = SOURCES.filter(({a}) => (WHEN[a.n] || ["perm"]).includes(ph.k));
      if (!items.length) return "";
      return `<details class="phase" style="--c:${PHASE[ph.c]}"><summary><span>${ph.n}</span><span class="count">${items.length}</span></summary>` +
        `<div class="abilities">` + items.map(({who,a}) => `<div class="ab-wrap"><p class="who">${esc(who)}</p>${abCard(a)}</div>`).join("") + `</div></details>`;
    }).join("");
  }
  renderRules();
  renderPhases();

  function showUnit(u){
    const s = u.stats;
    let h = PHOTOS[u.id] ? `<div class="hero-photo"><img src="${PHOTOS[u.id]}" alt="${esc(u.en)}"></div>` : "";
    h += `<div class="statband"><div class="stats" style="--n:${s.W ? 5 : 4}">` +
      [[s.M,"Mouv.",""],[s.S,"Santé",""],[s.C,"Contrôle",""],[s.Sv,"Sauv."," sv"]].concat(s.W ? [[s.W,"Prot."," wd"]] : []).map(([v,l,c]) =>
        `<div><div class="disc${c}">${esc(v)}</div><div class="l">${l}</div></div>`).join("") + `</div></div>`;
    const idx = u.weapons.map((w,i) => ({w,i}));
    h += weaponBlock(u, idx.filter(o => !isMelee(o.w)), true);
    h += weaponBlock(u, idx.filter(o => isMelee(o.w)), false);
    h += `<h3 class="sec">Capacités</h3><div class="abilities">` + u.abilities.map(abCard).join("") + `</div>`;
    if (u.enhancements) h += `<h3 class="sec">Améliorations</h3><div class="abilities">` + u.enhancements.map(abCard).join("") + `</div>`;
    h += `<h3 class="sec">Mots-clés</h3><div class="kw">Mots-clés : <b>${esc(u.kw)}</b></div>`;
    $("unit").innerHTML = h;
  }

  // ---------- Navigation ----------
  function route(){
    const hash = location.hash.slice(1);
    const unit = UNITS.find(u => u.id === hash);
    const view = unit ? "unit" : (["phases","regles"].includes(hash) ? hash : "memo");
    $("view-memo").hidden = view !== "memo";
    $("view-regles").hidden = view !== "regles";
    $("view-phases").hidden = view !== "phases";
    $("view-unit").hidden = view !== "unit";
    $("back").hidden = view !== "unit";
    $("title").textContent = unit ? unit.en : "Forgeruines de Hashut";
    ["memo","regles","phases"].forEach(k => { if (k === view) $("nav-" + k).setAttribute("aria-current", "page"); else $("nav-" + k).removeAttribute("aria-current"); });
    if (unit) showUnit(unit);
    window.scrollTo(0, 0);
  }
  $("back").addEventListener("click", () => { location.hash = "memo"; });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
<script>
// PWA : service worker + bouton « Installer »
(function(){
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  const btn = document.getElementById("install");
  const hint = document.getElementById("ios-hint");
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (standalone) return;
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  window.addEventListener("appinstalled", () => { deferred = null; btn.hidden = true; });
  // iOS / iPadOS : pas d'invite automatique, on affiche la marche à suivre
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) btn.hidden = false;
  btn.addEventListener("click", async () => {
    if (deferred) {
      deferred.prompt();
      const choice = await deferred.userChoice;
      deferred = null;
      if (choice.outcome === "accepted") btn.hidden = true;
    } else if (ios) {
      hint.hidden = false;
    }
  });
  document.getElementById("ios-hint-ok").addEventListener("click", () => { hint.hidden = true; });
})();
</script>
</body>
